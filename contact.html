<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | LuxeStride</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="contact-page">
    <header class="header shop-header">
        <div class="content">
            <div class="nav-bar">
                <div class="logo">
                    <img src="./images/my logo 2.png" alt="LuxeStride" width="150" height="150">
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="contact.html" class="current" aria-current="page">Contact Us</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="account.html">Account</a></li>
                    </ul>
                    <img src="images/cart-removebg-preview.png" class="cart-icon" alt="">
                    <img src="images/menu-icon.png" class="menu-icon" alt="">
                </nav>
            </div>
        </div>
    </header>

    <main class="contact">
        <div class="contact-content">
            <h1 class="contact-us">Contact Us</h1>
            <p class="contact-us-p">We'd love to hear from you. Fill out the form below or reach us directly.</p>

            <div class="contact-layout">
                <form action="#" class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <label for="number">Phone Number</label>
                    <input type="tel" id="number" name="phone" autocomplete="tel" required>

                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="5" required></textarea>

                    <button type="submit" class="btn-form">Send message</button>
                </form>

                <aside class="contact-info">
                    <h2>Reach us directly</h2>
                    <p><strong>Email</strong><br>info@luxestride.com</p>
                    <p><strong>Phone</strong><br>+234 902 170 6893</p>
                    <p><strong>Location</strong><br>Lagos, Nigeria</p>
                </aside>
            </div>
        </div>
    </main>

    <script>
        const headerNav = document.querySelector(".header .nav-bar");
        const updateHeaderNav = () => {
            headerNav.classList.toggle("is-scrolled", window.scrollY > 48);
        };

        window.addEventListener("scroll", updateHeaderNav, { passive: true });
        updateHeaderNav();
    </script>
</body>
</html>
